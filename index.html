    <!-- JSON-LD: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Qu'est-ce qu'ImmoPrestige ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "ImmoPrestige est un logiciel de gestion immobilière et locative en ligne, conçu spécifiquement pour les agences immobilières, propriétaires et bailleurs en Côte d'Ivoire et en Afrique. Il permet de gérer les biens, locataires, loyers, contrats, quittances, lotissements et ventes immobilières depuis un seul outil."
          }
        },
        {
          "@type": "Question",
          "name": "Comment fonctionne le paiement des loyers en ligne ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "ImmoPrestige intègre les paiements Mobile Money (Orange Money, MTN Money, Moov Money), Wave et les cartes bancaires. Les locataires peuvent payer directement en ligne et les quittances sont générées automatiquement."
          }
        },
        {
          "@type": "Question",
          "name": "ImmoPrestige est-il gratuit ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Oui, ImmoPrestige propose un plan gratuit pour démarrer sans engagement et sans carte bancaire. Des forfaits payants sont disponibles pour les besoins plus importants avec plus de biens, locataires et fonctionnalités avancées."
          }
        },
        {
          "@type": "Question",
          "name": "Puis-je utiliser ImmoPrestige sur mon téléphone ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Oui, ImmoPrestige est une application web progressive (PWA) qui fonctionne sur tous les appareils : ordinateur, tablette et smartphone. Vous pouvez l'installer sur votre téléphone et l'utiliser même hors connexion."
          }
        },
        {
          "@type": "Question",
          "name": "ImmoPrestige fonctionne-t-il en Côte d'Ivoire ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Oui, ImmoPrestige est spécialement conçu pour le marché immobilier ivoirien et africain. Il prend en charge le Franc CFA (FCFA), les moyens de paiement locaux (Orange Money, Wave, MTN Money) et les réalités du terrain."
          }
        },
        {
          "@type": "Question",
          "name": "Comment gérer un lotissement avec ImmoPrestige ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "ImmoPrestige offre un module complet de gestion de lotissements : création d'îlots et parcelles, gestion des ventes, suivi des échéanciers de paiement, démarches administratives, documents juridiques et signatures numériques."
          }
        }
      ]
    }
